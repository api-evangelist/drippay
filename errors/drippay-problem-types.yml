documented_error_reference:
  source: https://docs.usedrip.ai/openapi.json (info.description "## Error Codes")
  note: >-
    Drippay publishes a five-row error table with a remediation hint per status.
    It is the provider's own text, reproduced verbatim below. It omits 402, 429,
    5xx and the role-based 403, all of which the contract declares — so the
    published reference is narrower than the contract.
  rows:
  - status: 400
    meaning: Bad request
    fix: Check request body matches schema
  - status: 401
    meaning: Invalid API key
    fix: 'Verify `Authorization: Bearer sk_...` header'
  - status: 404
    meaning: Not found
    fix: Customer/pricing plan doesn't exist. Create customer first.
  - status: 409
    meaning: Duplicate
    fix: Resource with this ID already exists
  - status: 422
    meaning: Validation error
    fix: Check required fields and types
role_based_403:
  source: https://docs.usedrip.ai/openapi.json (info.description "## API Key Roles")
  note: >-
    403 Forbidden is role-driven, not resource-driven. Secret keys carry a
    hierarchical role and the docs name the exact failure: "To create, update,
    or delete pricing plans and contracts, you must use a secret key (sk_*) with
    the ADMIN role. Using a lower-role key returns 403 Forbidden."
  roles:
  - name: READONLY
    level: lowest
    permissions: List and read resources (customers, charges, pricing plans, events)
  - name: OPERATOR
    level: mid
    permissions: '+ Create customers, charge usage, track internal usage, emit events, manage runs'
  - name: ADMIN
    level: highest
    permissions: '+ Create/update/delete pricing plans, manage contracts, manage API keys'
  - name: 'public key (pk_*)'
    level: n/a
    permissions: Always READONLY; cannot create or modify resources.
gaps:
- id: no-error-code-registry
  detail: >-
    Responses carry a machine-readable `code` string but Drippay publishes no
    registry of those code values. Only PAYMENT_REQUIRED and NOT_FOUND were
    observed live. An agent cannot branch on `code` without discovering values
    by hitting them.
- id: no-rfc9457
  detail: Errors are a custom JSON envelope, not application/problem+json.
