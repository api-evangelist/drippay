method: searched
source: >-
  https://docs.usedrip.ai/openapi.json — the provider's own "Error Codes" and
  "API Key Roles" tables published in info.description, plus the response codes
  declared across all 245 operations in
  openapi/_original/drippay-openapi-original.json
format: custom-json
envelope:
  content_type: application/json
  fields:
    error: Human-readable error message
    code: Machine-readable error code
    details: Array of { path } validation entries (present on 400/422)
notes: >-
  The Drip API does not use RFC 9457 application/problem+json; errors are
  returned as a plain JSON envelope { error, code, details[] }. The catalog
  below is derived from the response codes declared across 245 operations.
problems:
- status: 400
  title: Bad Request
  meaning: Malformed request or invalid input; check details[] for field paths.
  occurrences: 35
- status: 401
  title: Unauthorized
  meaning: Invalid or missing API key (Authorization bearer).
  occurrences: 106
- status: 402
  title: Payment Required
  meaning: >-
    Insufficient balance on POST /v1/usage. This is the most agent-relevant
    error in the API: the body is not a dead end but a machine-actionable
    payment instruction.
  code: PAYMENT_REQUIRED
  occurrences: 1
  operation: POST /v1/usage
  remediation: >-
    Sign the returned x402 payment request with the session key (EIP-712) and
    retry the call with X-Payment-* headers, or send the user to checkout_url to
    top up the balance.
  payload:
    payment:
      amount: Amount required, in USDC
      recipient: Payment recipient address
      currency: USDC
      chain: base-sepolia
      description: Human-readable charge description
      usageId: Unique usage identifier
      expiresAt: Unix timestamp (seconds) when the payment offer expires
      timestamp: Unix timestamp (seconds) when the request was created
      nonce: Unique nonce for replay protection
    x402:
      version: 1.0.0
      paymentRequest: Complete payment request to sign via EIP-712
    serverTime: '{ seconds, milliseconds, iso } for client clock synchronization'
    checkout_url: URL for balance top-up (nullable)
  standard: x402 1.0.0
