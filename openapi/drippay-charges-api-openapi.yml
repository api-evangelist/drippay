  /v1/cost-estimate/from-usage:
    post:
      operationId: estimateCostsFromUsage
      summary: Estimate costs from existing usage
      tags:
      - Charges
      description: '

        Estimate costs from existing usage events without creating charges.


        Queries usage events in the specified period and calculates what they would cost

        based on pricing plans. Supports custom pricing overrides for "what-if" scenarios.


        **Use cases:**

        - Budget planning and forecasting

        - Cost allocation previews

        - Retroactive pricing analysis

        - Comparing pricing strategies


        The response includes per-usage-type line items with quantity, unit price,

        and estimated cost. Notes indicate which usage types used custom pricing,

        default pricing, or had no pricing plan available.

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - periodStart
              - periodEnd
              properties:
                customerId:
                  type: string
                  description: Filter to a specific customer. Omit to estimate across all customers.
                periodStart:
                  type: string
                  format: date-time
                  description: Start of the estimation period (ISO 8601)
                  example: '2024-01-01T00:00:00.000Z'
                periodEnd:
                  type: string
                  format: date-time
                  description: End of the estimation period (ISO 8601)
                  example: '2024-01-31T23:59:59.999Z'
                defaultUnitPrice:
                  type: string
                  description: Default unit price (USDC) for usage types without a pricing plan
                  example: '0.001'
                includeChargedEvents:
                  type: boolean
                  description: 'Include events that already have charges (default: true)'
                  default: true
                usageTypes:
                  type: array
                  items:
                    type: string
                  description: Filter to specific usage types
                customPricing:
                  type: object
                  additionalProperties:
                    type: string
                  description: 'Custom pricing overrides: usageType → unitPrice. Takes precedence over DB pricing plans.'
                  example:
                    api_call: '0.005'
                    token: '0.0001'
      responses:
        '200':
          description: Cost estimate with line item breakdown
          content:
            application/json:
              schema:
                type: object
                description: Cost estimate with line item breakdown
                properties:
                  businessId:
                    type: string
                  customerId:
                    type: string
                  periodStart:
                    type: string
                  periodEnd:
                    type: string
                  lineItems:
                    type: array
                    items:
                      type: object
                      properties:
                        usageType:
                          type: string
                        quantity:
                          type: string
                        unitPrice:
                          type: string
                        estimatedCostUsdc:
                          type: string
                        eventCount:
                          type: integer
                        hasPricingPlan:
                          type: boolean
                  subtotalUsdc:
                    type: string
                  estimatedTotalUsdc:
                    type: string
                  currency:
                    type: string
                    enum:
                    - USDC
                  isEstimate:
                    type: boolean
                    enum:
                    - true
                  generatedAt:
                    type: string
                    format: date-time
                  notes:
                    type: array
                    items:
                      type: string
        '400':
          description: Invalid request parameters
          content:
            application/json:
              schema:
                description: Invalid request parameters
                type: object
                properties:
                  error:
                    type: string
                    description: Error message
                  code:
                    type: string
                    description: Error code
                  details:
                    type: array
                    items:
                      type: object
                      properties:
                        path:
                          type: string
                        message:
                          type: string
                    description: Validation error details
                required:
                - error
                - code
        '401':
          description: Missing or invalid API key
