  /v1/events/{id}/trace:
    get:
      operationId: traceEvent
      summary: Trace event causality
      tags:
      - Events
      description: "\nGet the full causality context for an event in a single API call.\n\nReturns:\n- **ancestors**: Parent chain from root to this event's parent\n- **children**: Direct child events caused by this event\n- **retryChain**: Original event and all retry attempts\n- **anomalies**: Detected anomalies linked to this event\n- **summary**: Quick stats (counts, hasFailures flag)\n\n**Query Parameters:**\n- `format=tree` - Returns ASCII tree output for CLI/support tickets\n\nThis is the primary debugging endpoint for tracing errors through the ledger.\n\n**Example use case**: Customer reports \"my run failed at step 5\"\n```\nGET /v1/events/{failingEventId}/trace\nGET /v1/events/{failingEventId}/trace?format=tree\n```\nReturns the complete context: what led to this event, what it triggered,\nwhether it was retried, and any anomalies detected.\n        "
      parameters:
      - schema:
          type: string
          enum:
          - json
          - tree
        in: query
        name: format
        required: false
        description: 'Output format (default: json)'
      - schema:
          type: string
        in: path
        name: id
        required: true
        description: Event ID to trace
      responses:
        '200':
          description: Full event trace with causality context
          content:
            application/json:
              schema:
                description: Full event trace with causality context
                type: object
                properties:
                  event:
                    type: object
                    description: The event being traced (full details)
                    properties:
                      id:
                        type: string
                      eventType:
                        type: string
                        enum:
                        - USAGE
                        - API_CALL
                        - LLM_INFERENCE
                        - TOOL_CALL
                        - DATABASE
                        - FILE_IO
                        - NETWORK
                        - DECISION
                        - HUMAN_IN_LOOP
                        - MEMORY
                        - CUSTOM
                        - TOOL_CALL_START
                        - TOOL_CALL_END
                        - TOOL_CALL_ERROR
                        - TOOL_CALL_RETRY
                        - TRAINING
                        - FINE_TUNING
                      actionName:
                        type: string
                      outcome:
                        type: string
                        enum:
                        - PENDING
                        - SUCCEEDED
                        - FAILED
                        - SKIPPED
                        - RETRIED
                        - TIMEOUT
                        - CANCELLED
                      explanation:
                        type: string
                        nullable: true
                      idempotencyKey:
                        type: string
                        nullable: true
                      customerId:
                        type: string
                      runId:
                        type: string
                        nullable: true
                      workflowId:
                        type: string
                        nullable: true
                      parentEventId:
                        type: string
                        nullable: true
                      retryOfEventId:
                        type: string
                        nullable: true
                      attemptNumber:
                        type: integer
                      createdAt:
                        type: string
                        format: date-time
                      inputHash:
                        type: string
                        nullable: true
                      outputHash:
                        type: string
                        nullable: true
                      childEvents:
                        type: array
                        items:
                          type: string
                      retriedBy:
                        type: string
                        nullable: true
                      chargeId:
                        type: string
                        nullable: true
                      costUsdc:
                        type: string
                        nullable: true
                      usageType:
                        type: string
                        nullable: true
                      quantity:
                        type: string
                        nullable: true
                      units:
                        type: string
                        nullable: true
                      description:
                        type: string
                        nullable: true
                      metadata:
                        type: object
                        nullable: true
                        additionalProperties: true
                      spanKind:
                        type: string
                        nullable: true
                      inputBytes:
                        type: integer
                        nullable: true
                      outputBytes:
                        type: integer
                        nullable: true
                      queueDurationMs:
                        type: integer
                        nullable: true
                      executionDurationMs:
                        type: integer
                        nullable: true
                      startedAt:
                        type: string
                        format: date-time
                        nullable: true
                      endedAt:
                        type: string
                        format: date-time
                        nullable: true
                      errorType:
                        type: string
                        nullable: true
                      errorMessage:
                        type: string
                        nullable: true
                      errorStack:
                        type: string
                        nullable: true
                      retryCount:
                        type: integer
                        nullable: true
                      retryBackoffMs:
                        type: integer
                        nullable: true
                      retryReason:
                        type: string
                        nullable: true
                  ancestors:
                    type: array
                    description: Parent chain from root to parent (ordered root → parent)
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        eventType:
                          type: string
                        actionName:
                          type: string
                        outcome:
                          type: string
                        explanation:
                          type: string
                          nullable: true
                        attemptNumber:
                          type: integer
                        createdAt:
                          type: string
                          format: date-time
                        costUsdc:
                          type: string
                          nullable: true
                  children:
                    type: array
                    description: Direct child events
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        eventType:
                          type: string
                        actionName:
                          type: string
                        outcome:
                          type: string
                        explanation:
                          type: string
                          nullable: true
                        attemptNumber:
                          type: integer
                        createdAt:
                          type: string
                          format: date-time
                        costUsdc:
                          type: string
                          nullable: true
                  retryChain:
                    type: object
                    description: Retry chain if this event was retried or is a retry
                    properties:
                      originalEvent:
                        type: object
                        nullable: true
                        additionalProperties: true
                        description: The original event that was retried
                      retries:
                        type: array
                        description: All retry attempts ordered by attemptNumber
                        items:
                          type: object
                          additionalProperties: true
                  anomalies:
                    type: array
                    description: Anomalies linked to this event or its retry chain
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        anomalyType:
                          type: string
                        severity:
                          type: string
                        detectedAt:
                          type: string
                          format: date-time
                        status:
                          type: string
                        metric:
                          type: string
                          nullable: true
                        expectedValue:
                          type: string
                          nullable: true
                        actualValue:
                          type: string
                          nullable: true
                  summary:
                    type: object
                    description: Quick summary statistics
                    properties:
                      totalAncestors:
                        type: integer
                      totalChildren:
                        type: integer
                      totalRetries:
                        type: integer
                      totalAnomalies:
                        type: integer
                      hasFailures:
                        type: boolean
                        description: True if any event in trace has FAILURE outcome
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                description: Unauthorized
                type: object
                properties:
                  error:
                    type: string
                    description: Error message
                  code:
                    type: string
                    description: Error code
                  details:
                    type: array
                    items:
                      type: object
                      properties:
                        path:
                          type: string
                        message:
                          type: string
                    description: Validation error details
                required:
                - error
                - code
        '404':
          description: Event not found
          content:
            application/json:
              schema:
                description: Event not found
                type: object
                properties:
                  error:
                    type: string
                    description: Error message
                  code:
                    type: string
                    description: Error code
                  details:
                    type: array
                    items:
                      type: object
                      properties:
                        path:
                          type: string
                        message:
                          type: string
                    description: Validation error details
                required:
                - error
                - code
