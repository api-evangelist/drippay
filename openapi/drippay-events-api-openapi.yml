  /v1/events/payloads:
    get:
      operationId: listEventPayloads
      summary: List events with payloads (flat format)
      tags:
      - Events
      description: "\nReturns events joined with their stored payloads in a flat, tabular format\ndesigned for data engineers and SQL-based workflows.\n\nEach row is a single event with its input/output payloads inlined.\nOnly events that have stored payloads are returned (i.e., events created\nwith `input` or `output` fields).\n\n**Filters:** `customerId`, `actionName`, `from`/`to` (ISO 8601 date range),\n`hasInput`, `hasOutput` (boolean).\n\n**Use cases:**\n- Export to data warehouses (BigQuery, Snowflake, Redshift)\n- Ad-hoc SQL analysis of event payloads\n- Training data extraction for ML pipelines\n- Compliance audits requiring full payload history\n        "
      parameters:
      - schema:
          type: string
        in: query
        name: customerId
        required: false
        description: Filter by customer
      - schema:
          type: string
        in: query
        name: actionName
        required: false
        description: Filter by action name
      - schema:
          type: string
          enum:
          - USAGE
          - API_CALL
          - LLM_INFERENCE
          - TOOL_CALL
          - DATABASE
          - FILE_IO
          - NETWORK
          - DECISION
          - HUMAN_IN_LOOP
          - MEMORY
          - CUSTOM
          - TOOL_CALL_START
          - TOOL_CALL_END
          - TOOL_CALL_ERROR
          - TOOL_CALL_RETRY
          - TRAINING
          - FINE_TUNING
        in: query
        name: eventType
        required: false
        description: Filter by event type
      - schema:
          type: string
          format: date-time
        in: query
        name: from
        required: false
        description: Start of time range (inclusive)
      - schema:
          type: string
          format: date-time
        in: query
        name: to
        required: false
        description: End of time range (inclusive)
      - schema:
          type: boolean
        in: query
        name: hasInput
        required: false
        description: Only events with input payloads
      - schema:
          type: boolean
        in: query
        name: hasOutput
        required: false
        description: Only events with output payloads
      - schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 50
        in: query
        name: limit
        required: false
      - schema:
          type: integer
          minimum: 0
          default: 0
        in: query
        name: offset
        required: false
      responses:
        '200':
          description: Flat list of events with inlined payloads
          content:
            application/json:
              schema:
                description: Flat list of events with inlined payloads
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        eventId:
                          type: string
                        customerId:
                          type: string
                        actionName:
                          type: string
                        eventType:
                          type: string
                        outcome:
                          type: string
                          nullable: true
                        quantity:
                          type: string
                        units:
                          type: string
                          nullable: true
                        idempotencyKey:
                          type: string
                        createdAt:
                          type: string
                          format: date-time
                        inputPayload:
                          type: object
                          nullable: true
                          additionalProperties: true
                        outputPayload:
                          type: object
                          nullable: true
                          additionalProperties: true
                        inputHash:
                          type: string
                          nullable: true
                        outputHash:
                          type: string
                          nullable: true
                        inputSizeBytes:
                          type: integer
                          nullable: true
                        outputSizeBytes:
                          type: integer
                          nullable: true
                        payloadExpiresAt:
                          type: string
                          format: date-time
                          nullable: true
                        runId:
                          type: string
                          nullable: true
                        workflowId:
                          type: string
                          nullable: true
                        metadata:
                          type: object
                          nullable: true
                          additionalProperties: true
                  pagination:
                    type: object
                    properties:
                      total:
                        type: integer
                      limit:
                        type: integer
                      offset:
                        type: integer
                      hasMore:
                        type: boolean
                  sql_hint:
                    type: string
                    description: Example SQL query for this data set
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                description: Unauthorized
                type: object
                properties:
                  error:
                    type: string
                    description: Error message
                  code:
                    type: string
                    description: Error code
                  details:
                    type: array
                    items:
                      type: object
                      properties:
                        path:
                          type: string
                        message:
                          type: string
                    description: Validation error details
                required:
                - error
                - code
