  /v1/run-events/batch:
    post:
      operationId: batchEmitRunEvents
      summary: Batch emit events to runs (legacy)
      tags:
      - Runs
      description: 'Emit multiple events in a single request. All events are stored idempotently.


        **Note:** This is the legacy endpoint. For the newer execution-first API with richer metadata,

        use POST /v1/events instead.


        Each event can specify its own runId, customerId, and workflowId. If runId is provided,

        the event is attached to that run. Otherwise, it''s a standalone event.'
      responses:
        '201':
          description: Events emitted
          content:
            application/json:
              schema:
                description: Events emitted
                type: object
                properties:
                  success:
                    type: boolean
                  created:
                    type: integer
                  duplicates:
                    type: integer
                  events:
                    type: array
