  /v1/runs/record:
    post:
      operationId: recordRun
      summary: Record a complete run in one call
      tags:
      - Runs
      description: 'One-call convenience endpoint that atomically creates a workflow (if needed),

        starts a run, emits events, and ends the run.


        This replaces the 4-step SDK orchestration:

        1. GET /workflows (resolve slug)

        2. POST /runs (start)

        3. POST /run-events/batch (emit events)

        4. PATCH /runs/:id (end)


        The `workflow` field can be a workflow ID or a slug. If a slug is provided

        and no matching workflow exists, one is auto-created.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                customerId:
                  type: string
                  description: Drip customer ID (cus_*)
                  example: cus_abc123
                workflow:
                  type: string
                  description: Workflow slug/name or workflow ID (wf_*)
                  example: research-agent
                events:
                  type: array
                  maxItems: 100
                  description: Ordered list of events to attach to the run
                  items:
                    type: object
                    properties:
                      eventType:
                        type: string
                        description: Event name for this step (for example llm.call, tool.call, agent.plan)
                        example: llm.call
                      quantity:
                        type: number
                        description: Optional numeric quantity for the event
                        example: 1700
                      units:
                        type: string
                        description: Optional unit label for quantity
                        example: tokens
                      description:
                        type: string
                        description: Optional human-readable label or summary
                        example: web-search
                      costUnits:
                        type: number
                        description: Optional cost attributed to this event
                        example: 0.35
                      metadata:
                        type: object
                        additionalProperties: true
                        description: Optional structured metadata such as model, token breakdown, latency, or tool details
                        example:
                          model: gpt-4
                          inputTokens: 500
                          outputTokens: 1200
                    required:
                    - eventType
                  default: []
                status:
                  type: string
                  enum:
                  - COMPLETED
                  - FAILED
                  - CANCELLED
                  - TIMEOUT
                  description: Final run status
                  example: COMPLETED
                errorMessage:
                  type: string
                  description: Optional failure message when status is FAILED
                  example: Provider returned rate_limited
                errorCode:
                  type: string
                  description: Optional machine-readable failure code
                  example: rate_limited
                externalRunId:
                  type: string
                  description: Optional idempotent run identifier from your system
                  example: job_123
                correlationId:
                  type: string
                  description: Optional trace or request ID for cross-system correlation
                  example: trace_abc123
                metadata:
                  type: object
                  additionalProperties: true
                  description: Optional metadata stored on the run itself
                  example:
                    tenant: acme
                    environment: production
              required:
              - customerId
              - workflow
              - status
      responses:
        '201':
          description: Run recorded
          content:
            application/json:
              schema:
                description: Run recorded
                type: object
                properties:
                  run:
                    type: object
                    properties:
                      id:
                        type: string
                      workflowId:
                        type: string
                      workflowName:
                        type: string
                      status:
                        type: string
                      durationMs:
                        type: integer
                        nullable: true
                  events:
                    type: object
                    properties:
                      created:
                        type: integer
                      duplicates:
                        type: integer
                  totalCostUnits:
                    type: string
                    nullable: true
                  summary:
                    type: string
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                description: Validation error
                type: object
                properties:
                  error:
                    type: string
                    description: Error message
                  code:
                    type: string
                    description: Error code
                  details:
                    type: array
                    items:
                      type: object
                      properties:
                        path:
                          type: string
                        message:
                          type: string
                    description: Validation error details
                required:
                - error
                - code
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                description: Unauthorized
                type: object
                properties:
                  error:
                    type: string
                    description: Error message
                  code:
                    type: string
                    description: Error code
                  details:
                    type: array
                    items:
                      type: object
                      properties:
                        path:
                          type: string
                        message:
                          type: string
                    description: Validation error details
                required:
                - error
                - code
        '404':
          description: Customer or workflow not found
          content:
            application/json:
              schema:
                description: Customer or workflow not found
                type: object
                properties:
                  error:
                    type: string
                    description: Error message
                  code:
                    type: string
                    description: Error code
                  details:
                    type: array
                    items:
                      type: object
                      properties:
                        path:
                          type: string
                        message:
                          type: string
                    description: Validation error details
                required:
                - error
                - code
        '409':
          description: Run with externalRunId already exists
          content:
            application/json:
              schema:
                description: Run with externalRunId already exists
                type: object
                properties:
                  error:
                    type: string
                    description: Error message
                  code:
                    type: string
                    description: Error code
                  details:
                    type: array
                    items:
                      type: object
                      properties:
                        path:
                          type: string
                        message:
                          type: string
                    description: Validation error details
                required:
                - error
                - code
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: API Key
      description: 'API key from Drip Dashboard. Format: `sk_live_...` or `sk_test_...`'
