servers:
- url: https://api.drippay.dev
  description: Production
- url: http://localhost:3001
  description: Development
security:
- bearerAuth: []
tags:
- name: Invoices
  description: Generate, issue, and manage invoices. Supports usage-based and subscription-based billing periods.
paths:
  /v1/invoices/generate:
    post:
      operationId: generateInvoice
      summary: Generate invoice from charges
      tags:
      - Invoices
      description: "\nGenerate an invoice from charges within a billing period.\nAutomatically aggregates charges by usage type into line items.\n\nThe invoice is created in DRAFT status. Use the issue endpoint to finalize it.\n        "
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - customerId
              - periodStart
              - periodEnd
              properties:
                customerId:
                  type: string
                  description: Customer ID to generate invoice for
                periodStart:
                  type: string
                  format: date-time
                  description: Start of billing period (ISO 8601)
                periodEnd:
                  type: string
                  format: date-time
                  description: End of billing period (ISO 8601)
                dueDate:
                  type: string
                  format: date-time
                  description: Payment due date (ISO 8601)
                includeSettledOnly:
                  type: boolean
                  default: false
                  description: Only include settled (confirmed) charges
                notes:
                  type: string
                  maxLength: 2000
                  description: Internal notes (not visible to customer)
                customerNotes:
                  type: string
                  maxLength: 2000
                  description: Notes visible to customer on invoice
      responses:
        '201':
          description: Invoice generated successfully
          content:
            application/json:
              schema:
                description: Invoice generated successfully
                type: object
                properties:
                  id:
                    type: string
                  invoiceNumber:
                    type: string
                  customerId:
                    type: string
                  periodStart:
                    type: string
                  periodEnd:
                    type: string
                  totalUsdc:
                    type: string
                  status:
                    type: string
                  lineItems:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        description:
                          type: string
                        usageType:
                          type: string
                        quantity:
                          type: string
                        unitPrice:
                          type: string
                        amountUsdc:
                          type: string
                  createdAt:
                    type: string
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                description: Validation error
                type: object
                properties:
                  error:
                    type: string
                    description: Error message
                  code:
                    type: string
                    description: Error code
                  details:
                    type: array
                    items:
                      type: object
                      properties:
                        path:
                          type: string
                        message:
                          type: string
                    description: Validation error details
                required:
                - error
                - code
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                description: Unauthorized
                type: object
                properties:
                  error:
                    type: string
                    description: Error message
                  code:
                    type: string
                    description: Error code
                  details:
                    type: array
                    items:
                      type: object
                      properties:
                        path:
                          type: string
                        message:
                          type: string
                    description: Validation error details
                required:
                - error
                - code
        '404':
          description: Customer not found
          content:
            application/json:
              schema:
                description: Customer not found
                type: object
                properties:
                  error:
                    type: string
                    description: Error message
                  code:
                    type: string
                    description: Error code
                  details:
                    type: array
                    items:
                      type: object
                      properties:
                        path:
                          type: string
                        message:
                          type: string
                    description: Validation error details
                required:
                - error
                - code
  /v1/invoices/generate-from-subscription:
    post:
      operationId: generateInvoiceFromSubscription
      summary: Generate invoice from subscription
      tags:
      - Invoices
      description: "\nGenerate an invoice for a subscription billing period.\nSupports prorated amounts for partial periods (mid-cycle starts, cancellations, upgrades/downgrades).\nOptionally includes usage charges from the same period.\n\nThe invoice is created in DRAFT status. Use the issue endpoint to finalize it.\n        "
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - customerId
              - subscriptionId
              properties:
                customerId:
                  type: string
                  description: Customer ID
                subscriptionId:
                  type: string
                  description: Subscription ID
                periodStart:
                  type: string
                  format: date-time
                  description: Override period start (ISO 8601)
                periodEnd:
                  type: string
                  format: date-time
                  description: Override period end (ISO 8601)
                dueDate:
                  type: string
                  format: date-time
                  description: Payment due date (ISO 8601)
                notes:
                  type: string
                  maxLength: 2000
                customerNotes:
                  type: string
                  maxLength: 2000
                includeUsageCharges:
                  type: boolean
                  default: false
                  description: Bundle usage charges in the same invoice
      responses:
        '201':
          description: Invoice generated
          content:
            application/json:
              schema:
                description: Invoice generated
                type: object
                additionalProperties: true
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                description: Validation error
                type: object
                properties:
                  error:
                    type: string
                    description: Error message
                  code:
                    type: string
                    description: Error code
                  details:
                    type: array
                    items:
                      type: object
                      properties:
                        path:
                          type: string
                        message:
                          type: string
                    description: Validation error details
                required:
                - error
                - code
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                description: Unauthorized
                type: object
                properties:
                  error:
                    type: string
                    description: Error message
                  code:
                    type: string
                    description: Error code
                  details:
                    type: array
                    items:
                      type: object
                      properties:
                        path:
                          type: string
                        message:
                          type: string
                    description: Validation error details
                required:
                - error
                - code
        '404':
          description: Not found
          content:
            application/json:
              schema:
                description: Not found
                type: object
                properties:
                  error:
                    type: string
                    description: Error message
                  code:
                    type: string
                    description: Error code
                  details:
                    type: array
                    items:
                      type: object
                      properties:
                        path:
                          type: string
                        message:
                          type: string
                    description: Validation error details
                required:
                - error
                - code
  /v1/invoices:
    get:
      operationId: listInvoices
      summary: List invoices
      tags:
      - Invoices
      description: Retrieve all invoices for your business with optional filtering.
      parameters:
      - schema:
          type: string
        in: query
        name: customerId
        required: false
        description: Filter by customer ID
      - schema:
          type: string
          enum:
          - DRAFT
          - PENDING
          - PAID
          - PARTIALLY_PAID
          - VOIDED
          - OVERDUE
        in: query
        name: status
        required: false
        description: Filter by status
      - schema:
          type: string
          format: date-time
        in: query
        name: startDate
        required: false
        description: Filter by created date (from)
      - schema:
          type: string
          format: date-time
        in: query
        name: endDate
        required: false
        description: Filter by created date (to)
      - schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 100
        in: query
        name: limit
        required: false
      - schema:
          type: integer
          minimum: 0
          default: 0
        in: query
        name: offset
        required: false
      responses:
        '200':
          description: List of invoices
          content:
            application/json:
              schema:
                description: List of invoices
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                  total:
                    type: integer
                  hasMore:
                    type: boolean
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                description: Unauthorized
                type: object
                properties:
                  error:
                    type: string
                    description: Error message
                  code:
                    type: string
                    description: Error code
                  details:
                    type: array
                    items:
                      type: object
                      properties:
                        path:
                          type: string
                        message:
                          type: string
                    description: Validation error details
                required:
                - error
                - code
  /v1/invoices/{id}:
    get:
      operationId: getInvoice
      summary: Get invoice
      tags:
      - Invoices
      description: Retrieve a specific invoice by ID.
      parameters:
      - schema:
          type: string
        in: path
        name: id
        required: true
        description: Invoice ID
      responses:
        '200':
          description: Invoice details
          content:
            application/json:
              schema:
                description: Invoice details
                type: object
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                description: Unauthorized
                type: object
                properties:
                  error:
                    type: string
                    description: Error message
                  code:
                    type: string
                    description: Error code
                  details:
                    type: array
                    items:
                      type: object
                      properties:
                        path:
                          type: string
                        message:
                          type: string
                    description: Validation error details
                required:
                - error
                - code
        '404':
          description: Invoice not found
          content:
            application/json:
              schema:
                description: Invoice not found
                type: object
                properties:
                  error:
                    type: string
                    description: Error message
                  code:
                    type: string
                    description: Error code
                  details:
                    type: array
                    items:
                      type: object
                      properties:
                        path:
                          type: string
                        message:
                          type: string
                    description: Validation error details
                required:
                - error
                - code
    patch:
      operationId: updateInvoice
      summary: Update mutable invoice fields (DRAFT only)
      tags:
      - Invoices
      description: Update NET terms, PO number, payment terms label, internal notes, or customer notes on a DRAFT invoice. Once issued, these fields are frozen.
      parameters:
      - schema:
          type: string
        in: path
        name: id
        required: true
      responses:
        '200':
          description: Default Response
  /v1/invoices/{id}/line-items:
    post:
      operationId: addInvoiceLineItem
      summary: Add an ad-hoc line item to a draft invoice
      tags:
      - Invoices
      description: Append a one-off line item (setup fee, services rendered, manual adjustment) to a DRAFT invoice. Only allowed on DRAFT invoices — once issued, line items are immutable; use credit notes for corrections.
      parameters:
      - schema:
          type: string
        in: path
        name: id
        required: true
      responses:
        '200':
          description: Default Response
  /v1/invoices/{id}/issue:
    post:
      operationId: issueInvoice
      summary: Issue invoice
      tags:
      - Invoices
      description: Finalize a draft invoice and mark it as pending payment.
      parameters:
      - schema:
          type: string
        in: path
        name: id
        required: true
        description: Invoice ID
      responses:
        '200':
          description: Invoice issued
          content:
            application/json:
              schema:
                description: Invoice issued
                type: object
        '400':
          description: Invalid status
          content:
            application/json:
              schema:
                description: Invalid status
                type: object
                properties:
                  error:
                    type: string
                    description: Error message
                  code:
                    type: string
                    description: Error code
                  details:
                    type: array
                    items:
                      type: object
                      properties:
                        path:
                          type: string
                        message:
                          type: string
                    description: Validation error details
                required:
                - error
                - code
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                description: Unauthorized
                type: object
                properties:
                  error:
                    type: string
                    description: Error message
                  code:
                    type: string
                    description: Error code
                  details:
                    type: array
                    items:
                      type: object
                      properties:
                        path:
                          type: string
                        message:
                          type: string
                    description: Validation error details
                required:
                - error
                - code
        '404':
          description: Invoice not found
          content:
            application/json:
              schema:
                description: Invoice not found
                type: object
                properties:
                  error:
                    type: string
                    description: Error message
                  code:
                    type: string
                    description: Error code
                  details:
                    type: array
                    items:
                      type: object
                      properties:
                        path:
                          type: string
                        message:
                          type: string
                    description: Validation error details
                required:
                - error
                - code
  /v1/invoices/{id}/paid:
    post:
      operationId: markInvoicePaid
      summary: Mark invoice as paid
      tags:
      - Invoices
      description: "\nMark an invoice as paid. If amount is not provided, the full remaining balance is marked as paid.\nPartial payments can be recorded by specifying an amount.\n        "
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                amount:
                  type: string
                  description: Amount paid in USDC (optional, defaults to full balance)
                force:
                  type: boolean
                  description: Override payment terms enforcement (requires OWNER role)
      parameters:
      - schema:
          type: string
        in: path
        name: id
        required: true
        description: Invoice ID
      responses:
        '200':
          description: Invoice marked as paid
          content:
            application/json:
              schema:
                description: Invoice marked as paid
                type: object
        '400':
          description: Invalid status or amount
          content:
            application/json:
              schema:
                description: Invalid status or amount
                type: object
                properties:
                  error:
                    type: string
                    description: Error message
                  code:
                    type: string
                    description: Error code
                  details:
                    type: array
                    items:
                      type: object
                      properties:
                        path:
                          type: string
                        message:
                          type: string
                    description: Validation error details
                required:
                - error
                - code
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                description: Unauthorized
                type: object
                properties:
                  error:
                    type: string
                    description: Error message
                  code:
                    type: string
                    description: Error code
                  details:
                    type: array
                    items:
                      type: object
                      properties:
                        path:
                          type: string
                        message:
                          type: string
                    description: Validation error details
                required:
                - error
                - code
        '404':
          description: Invoice not found
          content:
            application/json:
              schema:
                description: Invoice not found
                type: object
                properties:
                  error:
                    type: string
                    description: Error message
                  code:
                    type: string
                    description: Error code
                  details:
                    type: array
                    items:
                      type: object
                      properties:
                        path:
                          type: string
                        message:
                          type: string
                    description: Validation error details
                required:
                - error
                - code
        '422':
          description: Payment terms not yet elapsed
          content:
            application/json:
              schema:
