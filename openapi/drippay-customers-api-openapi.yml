          description: Default Response
  /v1/customers/{id}/touches:
    get:
      operationId: listCustomerTouches
      summary: List recent touches for a customer
      tags:
      - Customers
      description: Return the most recent touches for a customer, ordered by `ts` descending. Default limit 10, max 100. Touches are pushed by drip-cli via POST /v1/sync/touches; this endpoint surfaces the last-N preview metadata.
      parameters:
      - schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 10
        in: query
        name: limit
        required: false
      - schema:
          type: string
        in: path
        name: id
        required: true
        description: Customer ID
      responses:
        '200':
          description: Default Response
  /v1/customers/{id}/balance:
    get:
      operationId: getCustomerBalance
      summary: Get customer balance
      tags:
      - Customers
      description: "\nRetrieve the current balance for a customer. Returns the latest cached\nbalance from the database (synced periodically from on-chain).\n\nFor real-time balance, call `POST /v1/customers/:id/sync-balance` first.\n        "
      parameters:
      - schema:
          type: string
        in: path
        name: id
        required: true
        description: Customer ID
      responses:
        '200':
          description: Customer balance
          content:
            application/json:
              schema:
                description: Customer balance
                type: object
                properties:
                  customerId:
                    type: string
                  onchainAddress:
                    type: string
                    pattern: ^0x[a-fA-F0-9]{40}$
                  balanceUsdc:
                    type: string
                    description: Available USDC balance
                  pendingChargesUsdc:
                    type: string
                    description: USDC in pending charges
                  availableUsdc:
                    type: string
                    description: Balance minus pending charges
                  lastSyncedAt:
                    type: string
                    format: date-time
                    nullable: true
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                description: Unauthorized
                type: object
                properties:
                  error:
                    type: string
                    description: Error message
                  code:
                    type: string
                    description: Error code
                  details:
                    type: array
                    items:
                      type: object
                      properties:
                        path:
                          type: string
                        message:
                          type: string
                    description: Validation error details
                required:
                - error
                - code
        '404':
          description: Customer not found
          content:
            application/json:
              schema:
                description: Customer not found
                type: object
                properties:
                  error:
                    type: string
                    description: Error message
                  code:
                    type: string
                    description: Error code
                  details:
                    type: array
                    items:
                      type: object
                      properties:
                        path:
                          type: string
                        message:
                          type: string
                    description: Validation error details
                required:
                - error
                - code
