                    type: string
                  code:
                    type: string
  /v1/customers/{id}/attach-plan:
    post:
      operationId: attachPlanToCustomer
      summary: Attach a Quickstart-managed plan to a customer
      tags:
      - Customers
      description: 'Creates a Stripe Subscription on the merchant''s connected account for the given Drip (customer, plan) pair. The plan MUST be Drip-managed (`managedBy=DRIP`); run provisionPlanOnStripe / POST `/pricing-plans/:id/reprovision-stripe` first if the plan is still `EXTERNAL`. Idempotent: re-calling with the same customer + plan returns the existing subscription.


        > **Requires a secret key (`sk_*`) with the `ADMIN` role.**'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                planId:
                  type: string
                  description: Drip pricing plan id
                customerEmailOverride:
                  type: string
                  description: Optional email to send to Stripe when the Drip customer row has none. Ignored if the customer already has an email.
              required:
              - planId
      parameters:
      - schema:
          type: string
        in: path
        name: id
        required: true
        description: Drip customer id
      responses:
        '200':
          description: Default Response
  /v1/customers/{id}/sync-stripe-customer:
    post:
      operationId: syncCustomerToStripe
      summary: Sync a Drip customer to Stripe (create cus_xxx and link)
      tags:
      - Customers
      description: 'Create a Stripe Customer on the merchant''s connected Stripe account for the given Drip customer and persist the resulting `cus_xxx` on the Drip customer row. Idempotent: if the Drip customer already has a `stripeCustomerId`, returns it unchanged. Works with API-key or OAuth-connected Stripe integrations. Email/name are pulled from the Drip customer''s `metadata.email` / `metadata.name`, falling back to `externalCustomerId` when it looks like an email, then to `emailOverride` from the request body.


        > **Requires a secret key (`sk_*`) with at least the `OPERATOR` role.**'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                integrationId:
                  type: string
                  description: Specific Stripe integration to use. Omit to auto-select the workspace's active Stripe integration.
                emailOverride:
                  type: string
                  description: Email to send to Stripe when the Drip customer has none in metadata or externalCustomerId.
      parameters:
      - schema:
          type: string
        in: path
        name: id
        required: true
        description: Drip customer id
      responses:
        '200':
          description: Default Response
  /v1/customers/{id}/hierarchy:
    get:
      operationId: getCustomerHierarchy
      summary: Get customer hierarchy
      tags:
      - Customers
      description: Returns the full ancestor chain (parent, grandparent, …) and all descendants for a customer.
      parameters:
      - schema:
          type: string
        in: path
        name: id
        required: true
      responses:
        '200':
          description: Default Response
  /v1/customers/{id}/rollup:
    get:
      operationId: getCustomerRollup
      summary: Get customer roll-up stats
      tags:
      - Customers
      description: Aggregated invoice totals and usage across this customer and all descendants.
      parameters:
      - schema:
          type: string
        in: path
        name: id
        required: true
      responses:
        '200':
          description: Default Response
  /v1/customers/{id}/touches:
    get:
      operationId: listCustomerTouches
      summary: List recent touches for a customer
      tags:
      - Customers
      description: Return the most recent touches for a customer, ordered by `ts` descending. Default limit 10, max 100. Touches are pushed by drip-cli via POST /v1/sync/touches; this endpoint surfaces the last-N preview metadata.
      parameters:
      - schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 10
        in: query
        name: limit
        required: false
      - schema:
          type: string
        in: path
        name: id
        required: true
        description: Customer ID
      responses:
        '200':
          description: Default Response
  /v1/customers/{id}/balance:
    get:
      operationId: getCustomerBalance
      summary: Get customer balance
      tags:
      - Customers
      description: 'Retrieve the current balance for a customer. Returns the latest cached

        balance from the database (synced periodically from on-chain).


        For real-time balance, call `POST /v1/customers/:id/sync-balance` first.'
      parameters:
      - schema:
          type: string
        in: path
        name: id
        required: true
        description: Customer ID
      responses:
        '200':
          description: Customer balance
          content:
            application/json:
              schema:
                description: Customer balance
                type: object
                properties:
                  customerId:
                    type: string
                  onchainAddress:
                    type: string
                    pattern: ^0x[a-fA-F0-9]{40}$
                  balanceUsdc:
                    type: string
                    description: Available USDC balance
                  pendingChargesUsdc:
                    type: string
                    description: USDC in pending charges
                  availableUsdc:
                    type: string
                    description: Balance minus pending charges
                  lastSyncedAt:
                    type: string
                    format: date-time
                    nullable: true
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                description: Unauthorized
                type: object
                properties:
                  error:
                    type: string
                    description: Error message
                  code:
                    type: string
                    description: Error code
                  details:
                    type: array
                    items:
                      type: object
                      properties:
                        path:
                          type: string
                        message:
                          type: string
                    description: Validation error details
                required:
                - error
                - code
        '404':
          description: Customer not found
          content:
            application/json:
              schema:
                description: Customer not found
                type: object
                properties:
                  error:
                    type: string
                    description: Error message
                  code:
                    type: string
                    description: Error code
                  details:
                    type: array
                    items:
                      type: object
                      properties:
                        path:
                          type: string
                        message:
                          type: string
                    description: Validation error details
                required:
                - error
                - code
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: API Key
      description: 'API key from Drip Dashboard. Format: `sk_live_...` or `sk_test_...`'
