  /v1/customers/{id}/spending-cap:
    put:
      operationId: setCustomerSpendingCap
      summary: Set customer spending cap
      tags:
      - Customers
      description: Set or update a per-customer spending cap. Supports DAILY_CHARGE_LIMIT, MONTHLY_CHARGE_LIMIT, and SINGLE_CHARGE_LIMIT. When autoBlock=true (default), charges are rejected at 100% of the cap. Requires a secret key (`sk_*`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - capType
              - limitValue
              properties:
                capType:
                  type: string
                  enum:
                  - DAILY_CHARGE_LIMIT
                  - MONTHLY_CHARGE_LIMIT
                  - SINGLE_CHARGE_LIMIT
                  description: Type of spending cap
                limitValue:
                  type: number
                  description: Spending limit in USDC
                autoBlock:
                  type: boolean
                  description: 'Auto-block charges when cap is reached (default: true)'
      parameters:
      - schema:
          type: string
        in: path
        name: id
        required: true
      responses:
        '200':
          description: Spending cap set
          content:
            application/json:
              schema:
                description: Spending cap set
                type: object
                properties:
                  id:
                    type: string
                  capType:
                    type: string
                  limitValue:
                    type: string
                  autoBlock:
                    type: boolean
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                description: Unauthorized
                type: object
                properties:
                  error:
                    type: string
                  code:
                    type: string
        '404':
          description: Customer not found
          content:
            application/json:
              schema:
                description: Customer not found
                type: object
                properties:
                  error:
                    type: string
                  code:
                    type: string
