  /v1/entitlement-plans/{id}/rules:
    post:
      operationId: createEntitlementRule
      summary: Add a rule to a plan
      tags:
      - Entitlements
      description: Add a feature limit rule to an entitlement plan.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                featureKey:
                  type: string
                  minLength: 1
                limitType:
                  type: string
                  enum:
                  - COUNT
                  - AMOUNT
                period:
                  type: string
                  enum:
                  - DAILY
                  - MONTHLY
                limitValue:
                  type: number
                  minimum: 0
                  description: Limit value (must be non-negative)
                unlimited:
                  type: boolean
              required:
              - featureKey
              - limitType
              - period
              - limitValue
      parameters:
      - schema:
          type: string
        in: path
        name: id
        required: true
      responses:
        '201':
          description: Rule created
          content:
            application/json:
