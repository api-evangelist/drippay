openapi: 3.2.0
info:
  title: Drip Entitlements API
  description: '# Drip API


    **Usage-based billing + execution ledger.**


    ---


    ## 60-Second Quickstart (Core SDK)


    ### 1.'
  version: 1.0.0
  contact:
    name: Drip Support
    email: support@drippay.dev
  x-logo:
    url: https://drippay.dev/logo.svg
    altText: Drip
servers:
- url: https://api.drippay.dev
  description: Production
- url: http://localhost:3001
  description: Development
security:
- bearerAuth: []
tags:
- name: Entitlements
  description: Quota management and pre-request access checks.
paths:
  /v1/entitlement-plans:
    get:
      operationId: listEntitlementPlans
      summary: List entitlement plans
      tags:
      - Entitlements
      description: Get all entitlement plans (tiers) for your business.
      responses:
        '200':
          description: List of entitlement plans
          content:
            application/json:
              schema:
                description: List of entitlement plans
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                  count:
                    type: integer
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: Error message
                  code:
                    type: string
                    description: Error code
                  details:
                    type: array
                    items:
                      type: object
                      properties:
                        path:
                          type: string
                        message:
                          type: string
                    description: Validation error details
                required:
                - error
                - code
                description: Unauthorized
    post:
      operationId: createEntitlementPlan
      summary: Create an entitlement plan
      tags:
      - Entitlements
      description: Create a new entitlement plan (tier) with feature rules.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 1
                slug:
                  type: string
                  minLength: 1
                  pattern: ^[a-z0-9_-]+$
                  description: URL-safe slug (lowercase alphanumeric, hyphens, underscores)
                description:
                  type: string
                isDefault:
                  type: boolean
              required:
              - name
              - slug
      responses:
        '201':
          description: Plan created
          content:
            application/json:
              schema:
                description: Plan created
                type: object
                additionalProperties: true
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: Error message
                  code:
                    type: string
                    description: Error code
                  details:
                    type: array
                    items:
                      type: object
                      properties:
                        path:
                          type: string
                        message:
                          type: string
                    description: Validation error details
                required:
                - error
                - code
                description: Unauthorized
        '409':
          description: Slug already exists
          content:
            application/json:
              schema:
                description: Slug already exists
                type: object
                properties:
                  error:
                    type: string
                  code:
                    type: string
