  /v1/entitlements/check:
    post:
      operationId: checkEntitlement
      summary: Check entitlement
      tags:
      - Entitlements
      description: 'Fast pre-request check: is this customer allowed to use this feature?


        Returns `allowed: true/false` with remaining quota. Use this before processing

        expensive requests to avoid wasting compute on customers who are over quota.


        Redis-backed hot-path with DB fallback for persisted usage events.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                customerId:
                  type: string
                  description: Customer ID
                featureKey:
                  type: string
                  description: Feature/meter key (e.g., "search", "api_calls")
                quantity:
                  type: number
                  description: 'Quantity to check (default: 1)'
              required:
              - customerId
              - featureKey
      responses:
        '200':
          description: Entitlement check result
          content:
            application/json:
              schema:
                description: Entitlement check result
                type: object
                properties:
                  allowed:
                    type: boolean
                  featureKey:
                    type: string
                  remaining:
                    type: number
                  limit:
                    type: number
                  unlimited:
                    type: boolean
                  period:
                    type: string
                    enum:
                    - DAILY
                    - MONTHLY
                  periodResetsAt:
                    type: string
                    format: date-time
                  reason:
                    type: string
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: Error message
                  code:
                    type: string
                    description: Error code
                  details:
                    type: array
                    items:
                      type: object
                      properties:
                        path:
                          type: string
                        message:
                          type: string
                    description: Validation error details
                required:
                - error
                - code
                description: Unauthorized
        '404':
          description: Customer not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: Error message
                  code:
                    type: string
                    description: Error code
                  details:
