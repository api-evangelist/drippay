  /v1/contracts/{id}/overrides:
    post:
      operationId: addContractPriceOverride
      summary: Add a price override
      tags:
      - Contracts
      description: 'Add or update a per-unit-type price override on a contract.


        Price overrides replace the default pricing plan rate for a specific usage type. For example, if your default `api_call` plan charges $0.001/call, a contract override of $0.0008/call gives this customer a negotiated enterprise rate.


        If an override for the given `unitType` already exists, it is updated (upsert behavior). Only ACTIVE contracts accept new overrides.


        > **Requires a secret key (`sk_*`) with the `ADMIN` role.**'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Add or update a per-unit-type price override on a contract. If an override already exists for the given `unitType`, it is updated (upsert). Only ACTIVE contracts accept overrides.
              properties:
                unitType:
                  type: string
                  minLength: 1
                  description: The usage type to override pricing for. Must match a `unitType` in your pricing plans (e.g., "api_call", "token").
                  example: api_call
                unitPriceUsd:
                  type: string
                  description: Custom price per unit in USD. Must be a non-negative number as a string (for decimal precision). Use "0" for free-tier overrides.
                  example: '0.000800'
              required:
              - unitType
              - unitPriceUsd
        description: Add or update a per-unit-type price override on a contract. If an override already exists for the given `unitType`, it is updated (upsert). Only ACTIVE contracts accept overrides.
      parameters:
