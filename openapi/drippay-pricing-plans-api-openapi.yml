  /v1/pricing-plans/{id}/reprovision-stripe:
    post:
      operationId: reprovisionPricingPlanStripe
      summary: Retry Stripe auto-provisioning for a plan
      tags:
      - Pricing Plans
      description: 'Retries the Drip-managed Stripe Product / Meter / Price provisioning for a pricing plan. Useful after an initial transient failure on plan create. Idempotent: already-provisioned objects are skipped; only the missing Stripe calls are made.


        > **Requires a secret key (`sk_*`) with the `ADMIN` role.**'
      parameters:
      - schema:
          type: string
        in: path
        name: id
        required: true
        description: Pricing plan ID
      responses:
        '200':
          description: Default Response
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: API Key
      description: 'API key from Drip Dashboard. Format: `sk_live_...` or `sk_test_...`'
