                      type: object
                      properties:
                        path:
                          type: string
                        message:
                          type: string
                    description: Validation error details
                required:
                - error
                - code
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                description: Rate limit exceeded
                type: object
                properties:
                  error:
                    type: string
                    description: Error message
                  code:
                    type: string
                    description: Error code
                  details:
                    type: array
                    items:
                      type: object
                      properties:
                        path:
                          type: string
                        message:
                          type: string
                    description: Validation error details
                required:
                - error
                - code
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                description: Internal error
                type: object
                properties:
                  error:
                    type: string
                    description: Error message
                  code:
                    type: string
                    description: Error code
                  details:
                    type: array
                    items:
                      type: object
                      properties:
                        path:
                          type: string
                        message:
                          type: string
                    description: Validation error details
                required:
                - error
                - code
        '503':
          description: OAuth provider not configured
          content:
            application/json:
              schema:
                description: OAuth provider not configured
                type: object
                properties:
                  error:
                    type: string
                    description: Error message
                  code:
                    type: string
                    description: Error code
                  details:
                    type: array
                    items:
                      type: object
                      properties:
                        path:
                          type: string
                        message:
                          type: string
                    description: Validation error details
                required:
                - error
                - code
  /v1/integrations/comms/slack/realtime/stream:
    get:
      operationId: commsSlackRealtimeStream
      summary: Stream managed Slack realtime messages to desktop clients
      tags:
      - Integrations
      responses:
        '200':
          description: Default Response
  /v1/integrations/comms/slack/events/stream:
    get:
      operationId: commsSlackEventsStream
      summary: Stream managed Slack realtime messages to desktop clients
      tags:
      - Integrations
      responses:
        '200':
          description: Default Response
  /v1/integrations/comms/linkedin/realtime/stream:
    get:
      operationId: commsLinkedInRealtimeStream
      summary: Stream managed LinkedIn realtime events to desktop clients
      tags:
      - Integrations
      responses:
        '200':
          description: Default Response
  /v1/integrations/comms/linkedin/events/stream:
    get:
      operationId: commsLinkedInEventsStream
      summary: Stream managed LinkedIn realtime events to desktop clients
      tags:
      - Integrations
      responses:
        '200':
          description: Default Response
  /v1/integrations/comms/linkedin/events:
    post:
      operationId: commsLinkedInRealtimePublish
      summary: Publish local LinkedIn realtime events to desktop clients
      tags:
      - Integrations
      responses:
        '200':
          description: Default Response
  /v1/integrations/comms/slack/callback:
    get:
      operationId: commsSlackCallback
      summary: Slack OAuth redirect handler
      tags:
      - Integrations
      responses:
        '200':
          description: Default Response
