aid: drippay
name: Drippay
description: >-
  Drippay, Inc. ("drip") is a Y Combinator company (YC P26) building two
  connected products. drip is a local-first Mac app that turns LinkedIn,
  iMessage, and email conversations into a self-filling CRM with AI drafting,
  follow-up, and meeting booking. The Drip API is a usage-based billing and
  execution-ledger platform for AI agents — a Stripe-like metering and
  monetization backend exposing customers, subscriptions, pricing plans,
  billable metrics, usage events, invoices, credit notes, coupons,
  entitlements, charges, dunning, tax, contracts, drift detection, and webhooks
  over a REST interface at api.drippay.dev. It ships official Node, Python, and
  C++ SDKs, an idempotency-key contract, cursor pagination, a hosted MCP server,
  and a SOC 2 Type I security posture monitored with Vanta.
url: https://raw.githubusercontent.com/api-evangelist/drippay/refs/heads/main/apis.yml
accessModel:
  pricing: unknown
  onboarding: self-serve
  trial: false
  try_now: false
  public: false
  label: Self-serve signup
  confidence: medium
  source:
