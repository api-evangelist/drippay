finding: >-
  An agent that connects only the MCP server can run outbound sales but cannot
  meter, price, invoice or collect. An agent that holds only a REST key can bill
  but cannot source or draft. The two surfaces do not substitute for each other,
  and no published artifact from Drippay says so.
