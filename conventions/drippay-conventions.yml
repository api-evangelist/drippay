docs: https://docs.usedrip.ai/
summary: >-
  Cross-cutting request/response semantics for the Drip API, derived from the
  published OpenAPI and quickstart docs.
authentication:
  style: bearer
  header: 'Authorization: Bearer sk_live_... | sk_test_...'
  notes: Secret keys are server-side only; separate test and live key prefixes.
  see: authentication/drippay-authentication.yml
idempotency:
  supported: true
  mechanism: request parameter
  param: idempotencyKey
  scope: mutating operations (POST usage/events/runs/customers/billing flows)
  notes: >-
    The OpenAPI declares an idempotencyKey parameter on write operations so a
    retried create/record does not double-charge or double-record. This is the
    canonical usage-based-billing idempotency contract.
  evidence: openapi parameter idempotencyKey
pagination:
  style: cursor
  params: [cursor, limit, offset]
  notes: List endpoints accept a cursor plus limit; offset is also accepted on some collections.
rate_limiting:
  documented: partial
  response_status: 429
  evidence: 21 of 245 operations declare a 429 response.
  headers: none documented — no Retry-After, RateLimit-* or X-RateLimit-*.
  numbers_published: false
  see: rate-limits/drippay-rate-limits.yml
versioning:
  scheme: uri-path
  current: v1
  base_path: /v1
error_envelope:
  format: custom-json
  fields:
  - error   # human-readable message
  - code    # machine error code
  - details # array of { path, ... } validation entries
  content_type: application/json
  see: errors/drippay-problem-types.yml
webhooks:
  supported: true
  signing: HMAC secret per endpoint (rotate-secret supported)
  see: asyncapi/drippay-webhooks.yml
authorization:
  model: role-on-key
  roles: [READONLY, OPERATOR, ADMIN]
  note: >-
    The REST API has no OAuth and therefore no scopes. Authority is carried by a
    hierarchical role attached to each secret key; ADMIN is required to mutate
    pricing plans and contracts, and a lower role returns 403.
  oauth_surface: >-
    OAuth exists only for the hosted MCP server, with two coarse scopes
    (read, write) — see scopes/drippay-scopes.yml.
  see: authentication/drippay-authentication.yml
agent_payment:
  standard: x402 1.0.0
  trigger: 402 Payment Required on POST /v1/usage when the balance is insufficient
  flow: >-
    The 402 body carries a complete payment request (amount in USDC, recipient,
    chain base-sepolia, nonce, expiresAt, serverTime). The client signs it with
    its session key via EIP-712 and retries the call with X-Payment-* headers.
    A checkout_url is offered as the human fallback.
  significance: >-
    This is the convention that makes the API self-settling for an agent: the
    error response is a machine-actionable instruction rather than a dead end.
  see: errors/drippay-problem-types.yml
numeric_representation:
  monetary_amounts: >-
    Returned as strings (e.g. "0.001000") to preserve precision. Clients must
    not parse them as floats.
  source: https://docs.usedrip.ai/openapi.json (info.description "Important Notes")
