summary: >-
  Drippay declares rate limiting in its contract but does not publish the
  numbers or the runtime headers. 21 of 245 operations declare a 429 "Rate limit
  exceeded" response, and the 429 body is the same { error, code, details[] }
  envelope every other error uses — no Retry-After, no RateLimit-* or
  X-RateLimit-* header is described anywhere in the OpenAPI, and the docs site
  (6 published pages plus a generated API reference) has no rate-limit page. An
  agent can detect exhaustion from the status code but cannot budget against it
  or learn when to retry.
