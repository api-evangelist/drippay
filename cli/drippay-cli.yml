name: drip-cli
description: >-
  Local autopilot daemon for customer intelligence. drip-cli is the headless
  companion to the drip / dreach Mac app — it runs the local sync and follow-up
  loop on the user's own machine, polling the Drip API for state (for example
  GET /v1/opens-since for email-pixel opens, matched against the local
  email_opens table) and driving the local database the app reads from.
